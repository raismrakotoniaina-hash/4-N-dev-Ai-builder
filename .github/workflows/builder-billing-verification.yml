name: Builder billing verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/builder-subscriptions-credits-foundation]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Server tests
        run: npm run test:server
      - name: Frontend production build
        run: npm run build
