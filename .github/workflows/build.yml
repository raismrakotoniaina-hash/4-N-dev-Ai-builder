name: AI Builder Build

on:
  push:
    branches: [main, feat/builder-backend-foundation, rebuild/base44-style-clean-v1]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pull isolated build image
        run: docker pull node:24-bookworm-slim
      - run: npm run build
      - name: Test server and isolated build worker
        run: npm run test:server
        env:
          RUN_ISOLATED_DOCKER_TESTS: '1'
