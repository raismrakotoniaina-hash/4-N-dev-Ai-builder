name: Builder CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Builder CI / build-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: builder_test
          POSTGRES_PASSWORD: builder_test
          POSTGRES_DB: builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U builder_test -d builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://builder_test:builder_test@localhost:5432/builder_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run server tests
        run: npm run test:server
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
      - name: Validate Expo Android bundle
        run: node scripts/validate-mobile.js
      - name: Build frontend
        run: npm run build
