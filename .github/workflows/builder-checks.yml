name: Builder checks

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/free-premium-generation-clean-ui"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm run test:server
      - name: Build frontend
        run: npm run build
